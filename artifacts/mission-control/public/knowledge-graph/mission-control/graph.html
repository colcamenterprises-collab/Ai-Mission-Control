<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mission Control Knowledge Graph</title>
<style>
body{margin:0;background:#050b14;color:#e9fbff;font-family:monospace}
.wrap{height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
.card{border:1px solid rgba(94,231,255,.3);border-radius:22px;padding:28px;background:#071827;box-shadow:0 0 50px rgba(94,231,255,.18);max-width:720px}
h1{margin:0 0 12px;text-transform:uppercase;letter-spacing:.12em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.stat{border:1px solid rgba(94,231,255,.22);border-radius:14px;padding:14px}
.big{font-size:28px;color:#5ee7ff}
p{color:#9fc7d7;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Mission Control Knowledge Graph</h1>
    <p>Local placeholder artifact. Future Graphify runs will replace this with generated repository, wiki, docs and diagram intelligence.</p>
    <div class="grid">
      <div class="stat"><div class="big">7</div><div>Nodes</div></div>
      <div class="stat"><div class="big">9</div><div>Edges</div></div>
      <div class="stat"><div class="big">3</div><div>Communities</div></div>
      <div class="stat"><div class="big">0</div><div>External deps</div></div>
    </div>
  </div>
</div>
</body>
</html>
