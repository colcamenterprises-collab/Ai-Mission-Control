name: Mission Control CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: "5173"
      BASE_PATH: "/"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Workflow tests
        run: pnpm test:workflow

      - name: Execution policy tests
        run: pnpm test:execution

      - name: Operational schema tests
        run: pnpm test:operational-schema

      - name: Skills tests
        run: pnpm test:skills

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Diff hygiene
        run: git diff --check
